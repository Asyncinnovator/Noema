[project]
name = "noema-rag"
version = "0.1.0"
description = "Convert text into compact logical form for token-efficient RAG"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "knowledge-graph",
    "graphrag",
    "llm",
    "prompt-compression",
    "token-reduction",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    # Core pipeline: compress() + KnowledgeBase (parsing, canonicalization,
    # notation, storage, retrieval). torch/sentence-transformers are required,
    # not optional -- semantic dedup and vector retrieval need them.
    "faiss-cpu>=1.15.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sentence-transformers>=5.7.0",
    "spacy>=3.8.14",
    "tiktoken>=0.13.0",
    "torch>=2.5.0",
    # Pinned <5.0: transformers 5.x breaks fastcoref's model loading
    # (missing all_tied_weights_keys). Also covers this project's REBEL/NLI use.
    "transformers>=4.40,<5.0",
    "typer>=0.27.1",
    # Explicit: spacy.cli imports click directly, but neither spacy nor
    # typer declares it anymore (explosion/spaCy#13971).
    "click>=8.0",
]

[project.optional-dependencies]
# Coreference resolution, transformer-based relation extraction (REBEL),
# and NLI-based validation. Not used by compress()/KnowledgeBase. ~2.5GB
# of model weights on first use.
advanced-nlp = [
    "fastcoref>=2.1.6",
]

# Framework integrations -- noema.integrations.langchain / .llamaindex /
# .tokens. Each module imports its third-party package lazily -- only
# instantiating the retriever classes requires the matching extra.
langchain = [
    "langchain-core>=0.3.0",
]
llamaindex = [
    "llama-index-core>=0.12.0",
]
anthropic = [
    "anthropic>=0.40.0",
]

# Persistent graph backends -- noema.storage.neo4j_backend /
# .rdf_backend. Each module imports its third-party package lazily --
# only instantiating Neo4jBackend/RDFBackend requires the matching extra.
neo4j = [
    "neo4j>=5.26.0",
]
rdf = [
    "rdflib>=7.1.0",
]

[project.scripts]
noema = "noema.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    # Direct-URL models can't be published to PyPI, so they live here:
    # dependency groups aren't part of the published package metadata.
    # `uv sync` exact-syncs and removes anything not declared
    # (astral-sh/uv#12481), so the models are declared rather than downloaded.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# For compare_spacy_models.py only.
compare-models = [
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noema"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/benchmarks", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() calls as parameter defaults are the
# required way to declare a Typer CLI's options -- not the function-call-
# as-default-value mistake B008 otherwise flags.
"src/noema/cli.py" = ["B008"]
"benchmarks/run_benchmark.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmarks"]