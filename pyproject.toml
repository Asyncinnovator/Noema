[project]
name = "noema"
version = "0.1.0"
description = "Convert text into compact logical form for token-efficient RAG"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sentence-transformers>=5.7.0",
    "spacy>=3.8.14",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "tiktoken>=0.13.0",
    "torch>=2.5.0",
    "transformers>=4.40,<5.0",
    "typer>=0.27.1",
    "click>=8.0",
]

[project.optional-dependencies]
advanced-nlp = [
    "fastcoref>=2.1.6",
]

compare-models = [
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the en-core-web-sm / en-core-web-md direct-URL dependencies
# above -- hatchling disallows "name @ url" style dependencies by default
# (a safety measure against unreviewable install sources), and refuses to
# build the package at all without this explicit opt-in.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/noema"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]