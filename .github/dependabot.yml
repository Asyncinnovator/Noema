version: 2
updates:
  # Python dependencies from pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      # One pull request for all minor and patch updates, instead of one per package.
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # transformers is pinned below 5.0 because 5.x breaks fastcoref model loading.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"